name: Kwork Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kwork-bot-run
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save seen
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@users.noreply.github.com"
          git status
          git add -f seen.json
          # Создаем коммит, даже если Git сомневается, и разрешаем пустой коммит принудительно
          git commit -m "Update seen.json" || echo "No changes to commit"
          # Синхронизируемся с репозиторием и пушим
          git pull --rebase || true
          git push
