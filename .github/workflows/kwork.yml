name: Kwork Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kwork-bot-run
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Update seen.json" && git pull --rebase origin main && git push)
          
      - name: Clean up old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow=kwork.yml --limit 100 --json databaseId,status \
            --jq '.[] | select(.status == "completed") | .databaseId' \
            | tail -n +6 \
            | while read -r id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done
